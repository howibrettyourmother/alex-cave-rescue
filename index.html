function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle3(ans,alts){var o=[ans];for(var i=0;i<alts.length&&o.length<3;i++)if(o.indexOf(alts[i])<0)o.push(alts[i]);
 while(o.length<3){var v=ans+rnd(-3,3);if(v>=0&&o.indexOf(v)<0)o.push(v)}
 for(i=2;i>0;i--){var j=rnd(0,i),t=o[i];o[i]=o[j];o[j]=t}return o}

 if(k==='add'){a=rnd(1,4);b2=rnd(1,4);q.text=a+' + '+b2+' = ?';q.ans=a+b2;q.opts=shuffle3(q.ans,[q.ans+1,q.ans-1])}
 else if(k==='add2'){a=rnd(3,6);b2=rnd(2,5);q.text=a+' + '+b2+' = ?';q.ans=a+b2;q.opts=shuffle3(q.ans,[q.ans+2,q.ans-1])}
 else if(k==='sub'){a=rnd(5,9);b2=rnd(1,4);q.text=a+' − '+b2+' = ?';q.ans=a-b2;q.opts=shuffle3(q.ans,[q.ans+1,q.ans-2])}
 else if(k==='count'){a=rnd(3,7);q.text='How many? '+new Array(a+1).join('🍄');q.ans=a;q.opts=shuffle3(a,[a+1,a-1])}
 else {var P=[['🔴','🔵'],['⭐','🌙'],['🟢','🟡','🟣']][rnd(0,2)],seq=[];for(var i=0;i<5;i++)seq.push(P[i%P.length]);
  q.text='What comes next? '+seq.join('')+'❓';q.ans=P[5%P.length];var o=P.slice();if(o.length<3)o.push('🟠');
  q.opts=o.sort(function(){return Math.random()-.5})}
 return q}

function ac(){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A()}if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type,vol,f2,del){var a=ac();if(!a||muted)return;var t=a.currentTime+(del||0),o=a.createOscillator(),g=a.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
var NB=null;function noise(d,vol,ff,del,ff2){var a=ac();if(!a||muted)return;if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);var c=NB.getChannelData(0);for(var i=0;i<c.length;i++)c[i]=Math.random()*2-1}
 var t=a.currentTime+(del||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;s.loop=true;f.type='lowpass';f.frequency.setValueAtTime(ff||1200,t);if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t+d);
 g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.05)}
function sfx(n){var now=performance.now();if(now<jingleUntil&&n!=='hurt')return;if(lastS[n]&&now-lastS[n]<(n==='gem'?60:140))return;if(voices>=4)return;lastS[n]=now;voices++;setTimeout(function(){voices--},250);
 switch(n){case'jump':tone(320,.15,'square',.08,640);break;case'dj':tone(480,.15,'square',.08,960);break;
 case'gem':tone(1320,.08,'triangle',.12);tone(1760,.12,'triangle',.1,0,.06);break;case'hurt':tone(300,.25,'sawtooth',.1,90);break;
 case'stomp':tone(200,.12,'square',.12,80);noise(.1,.15,800);break;case'dash':noise(.25,.2,3000,0,300);break;
 case'fire':noise(.2,.15,2500,0,500);tone(600,.12,'sawtooth',.05,200);break;case'boom':noise(.5,.35,600,0,80);tone(90,.4,'sine',.3,40);break;
 case'roar':noise(.8,.3,400,0,150);tone(110,.8,'sawtooth',.12,60);break;case'door':tone(392,.1,'triangle',.12);tone(523,.1,'triangle',.12,0,.1);tone(784,.2,'triangle',.12,0,.2);break;

 case'heart':tone(660,.1,'triangle',.12);tone(990,.15,'triangle',.12,0,.1);break;case'cp':tone(523,.1,'triangle',.1);tone(659,.1,'triangle',.1,0,.1);tone(784,.15,'triangle',.1,0,.2);break;
 case'bounce':tone(200,.25,'sine',.2,900);break;case'break':noise(.3,.3,1500,0,200);break}}
